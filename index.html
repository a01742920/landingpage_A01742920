<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALE Sinaloa 2026 | Ingeniería Aeroespacial & Simulación de Vuelo</title>
    <style>
        :root {
            --bg-void: #05030f;
            --bg-panel: rgba(14, 9, 32, 0.82);
            --bg-panel-hover: rgba(24, 15, 54, 0.92);
            --gold-primary: #e5b869;
            --gold-bright: #fae0a8;
            --gold-dim: rgba(229, 184, 105, 0.28);
            --purple-glow: #7c3aed;
            --cyan-telemetry: #38bdf8;
            --text-main: #f3effc;
            --text-muted: #a99bc4;
            --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: 'Consolas', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-void);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            /* Cuadrícula técnica estilo plano de ingeniería aeroespacial */
            background-image: 
                linear-gradient(rgba(229, 184, 105, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(229, 184, 105, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        .gold-text {
            background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold-primary) 55%, #9e732a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ================= BARRA DE TELEMETRÍA / NAV ================= */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(5, 3, 15, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--gold-dim);
            padding: 0.85rem 2rem;
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .brand-logo {
            height: 44px;
            width: 44px;
            border-radius: 50%;
            border: 1.5px solid var(--gold-primary);
            box-shadow: 0 0 14px rgba(229, 184, 105, 0.35);
            object-fit: cover;
        }

        .brand-info {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 4px;
            line-height: 1;
        }

        .brand-tag {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--cyan-telemetry);
            letter-spacing: 1.5px;
            margin-top: 3px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 0.35rem 0;
            position: relative;
            transition: color 0.25s ease;
        }

        .nav-links a::before {
            content: '// ';
            color: var(--gold-primary);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--gold-bright);
        }

        .nav-links a:hover::before,
        .nav-links a.active::before {
            opacity: 1;
        }

        .nav-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--gold-bright);
            background: rgba(229, 184, 105, 0.1);
            border: 1px solid var(--gold-dim);
            padding: 0.4rem 0.9rem;
            border-radius: 4px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.25); }
        }

        /* ================= HERO AEROESPACIAL ================= */
        .hero {
            position: relative;
            min-height: 92vh;
            display: flex;
            align-items: center;
            padding: 4.5rem 2rem 5rem 2rem;
            background:
                radial-gradient(circle at 78% 42%, rgba(124, 58, 237, 0.28) 0%, transparent 45%),
                linear-gradient(90deg, rgba(5, 3, 15, 0.92) 0%, rgba(5, 3, 15, 0.72) 52%, rgba(5, 3, 15, 0.45) 100%),
                linear-gradient(180deg, rgba(5, 3, 15, 0.3) 0%, rgba(5, 3, 15, 0.96) 100%),
                url('a_widescreen_high_contrast_sci_fi_website_hero_he.png') center/cover no-repeat;
            border-bottom: 1px solid var(--gold-dim);
        }

        .hero-grid {
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 3rem;
            align-items: center;
        }

        .mission-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--cyan-telemetry);
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 0.45rem 1rem;
            margin-bottom: 1.2rem;
        }

        .hero-title {
            font-size: clamp(3.4rem, 7.5vw, 5.8rem);
            font-weight: 900;
            letter-spacing: 10px;
            line-height: 0.98;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .hero-sub {
            font-size: clamp(1.1rem, 2.4vw, 1.65rem);
            font-weight: 700;
            letter-spacing: 5px;
            color: var(--gold-primary);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .hero-desc {
            font-size: 1.1rem;
            color: var(--text-main);
            max-width: 560px;
            margin-bottom: 2rem;
            border-left: 3px solid var(--gold-primary);
            padding-left: 1.2rem;
        }

        .hero-cta-row {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .btn-hud {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.9rem 2rem;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--bg-void);
            background: linear-gradient(90deg, var(--gold-bright), var(--gold-primary));
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .btn-hud:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(229, 184, 105, 0.55);
        }

        .btn-hud-secondary {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.85rem 1.6rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--gold-bright);
            background: rgba(14, 9, 32, 0.75);
            border: 1px solid var(--gold-dim);
            transition: all 0.25s ease;
        }

        .btn-hud-secondary:hover {
            border-color: var(--gold-bright);
            background: rgba(229, 184, 105, 0.12);
        }

        /* Panel HUD de Telemetría y Cuenta Regresiva */
        .telemetry-hud {
            background: var(--bg-panel);
            border: 1px solid var(--gold-dim);
            padding: 2rem;
            backdrop-filter: blur(14px);
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 30px rgba(124, 58, 237, 0.12);
        }

        /* Esquinas técnicas tipo visor aeroespacial */
        .telemetry-hud::before,
        .telemetry-hud::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2px solid var(--gold-primary);
        }

        .telemetry-hud::before {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }

        .telemetry-hud::after {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(229, 184, 105, 0.2);
            padding-bottom: 0.8rem;
            margin-bottom: 1.2rem;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--cyan-telemetry);
        }

        .hud-target {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--gold-bright);
            margin-bottom: 1.3rem;
            letter-spacing: 0.5px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .time-cell {
            background: rgba(5, 3, 15, 0.85);
            border: 1px solid rgba(229, 184, 105, 0.22);
            padding: 0.95rem 0.75rem;
            text-align: center;
        }

        .time-cell .val {
            display: block;
            font-family: var(--font-mono);
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--gold-bright);
            line-height: 1.1;
        }

        .time-cell .unit {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-top: 0.35rem;
            text-transform: uppercase;
        }

        .hud-specs {
            border-top: 1px solid rgba(229, 184, 105, 0.2);
            padding-top: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            font-family: var(--font-mono);
            font-size: 0.78rem;
        }

        .hud-specs div span {
            color: var(--text-muted);
            display: block;
            font-size: 0.68rem;
        }

        .hud-specs div strong {
            color: var(--text-main);
        }

        /* ================= SECCIONES DE INGENIERÍA & MISIÓN ================= */
        .section {
            padding: 5.5rem 2rem;
            max-width: 1280px;
            margin: 0 auto;
        }

        .section-divider {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
        }

        .section-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid rgba(229, 184, 105, 0.18);
            padding-bottom: 1.2rem;
        }

        .section-code {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--cyan-telemetry);
            letter-spacing: 2px;
            display: block;
            margin-bottom: 0.35rem;
        }

        .section-top h2 {
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .section-top p {
            color: var(--text-muted);
            max-width: 520px;
            font-size: 0.98rem;
        }

        /* Módulos Técnicos (Acerca de / Ingeniería) */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 1.8rem;
        }

        .module-card {
            background: var(--bg-panel);
            border: 1px solid rgba(229, 184, 105, 0.2);
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative
