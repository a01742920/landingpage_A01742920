<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALE & Rocket Tec Sinaloa 2026 - Galería e Identidad Visual</title>
    <style>
        :root {
            --space-dark: #070617;
            --space-purple: #1b0e33;
            --nebula-purple: #461f7d;
            --rocket-gold: #d4af37;
            --text-light: #f0e6ff;
            --card-bg: rgba(27, 14, 51, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--space-dark);
            background-image: radial-gradient(circle at top right, #2a1147 0%, var(--space-dark) 70%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--rocket-gold);
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        header p {
            font-size: 1.1rem;
            color: #bfa8e6;
        }

        /* Estilos del Contador Regresivo */
        .countdown-section {
            max-width: 750px;
            margin: 0 auto 3rem auto;
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 14px;
            padding: 1.8rem 1.5rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(8px);
        }

        .countdown-title {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #bfa8e6;
            margin-bottom: 0.4rem;
        }

        .countdown-date {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--rocket-gold);
            margin-bottom: 1.5rem;
        }

        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(7, 6, 23, 0.75);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 10px;
            padding: 1rem 1.2rem;
            min-width: 105px;
            box-shadow: inset 0 0 12px rgba(70, 31, 125, 0.4);
        }

        .time-box span.number {
            display: block;
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--rocket-gold);
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }

        .time-box span.label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #d1c4e9;
            margin-top: 0.4rem;
        }

        .countdown-finished {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--rocket-gold);
            padding: 1rem 0;
        }

        /* Estilos de la Galería */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .gallery-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(112, 45, 206, 0.3);
            border-color: var(--rocket-gold);
        }

        .gallery-card.featured {
            grid-column: 1 / -1;
        }

        .img-container {
            width: 100%;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Fondo claro para logotipos transparentes con tipografía oscura */
        .img-container.light-preview {
            background: #f4f6fa;
            padding: 1.5rem;
        }

        .img-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-card:hover .img-container img {
            transform: scale(1.03);
        }

        .card-info {
            padding: 1.5rem;
            flex-grow: 1;
        }

        .card
