<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALE Sinaloa 2026 • Ciencia, Innovación y Exploración</title>
    <style>
        :root {
            --space-dark: #070414;
            --space-deep: #110829;
            --nebula-purple: #3b1775;
            --nebula-bright: #7d3cf8;
            --rocket-gold: #e5b869;
            --rocket-gold-light: #f9dfa4;
            --rocket-gold-dark: #9c722d;
            --text-light: #f4eeff;
            --text-muted: #c5b6e0;
            --card-bg: rgba(20, 10, 46, 0.72);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--space-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Tipografía metálica dorada estilo TALE */
        .gold-gradient-text {
            background: linear-gradient(180deg, var(--rocket-gold-light) 0%, var(--rocket-gold) 50%, var(--rocket-gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ================= NAVEGACIÓN SUPERIOR ================= */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(7, 4, 20, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(229, 184, 105, 0.35);
            padding: 0.9rem 2rem;
        }

        .nav-container {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            text-decoration: none;
        }

        .nav-brand img {
            height: 46px;
            width: auto;
            border-radius: 50%;
            border: 1.5px solid var(--rocket-gold);
            box-shadow: 0 0 12px rgba(229, 184, 105, 0.35);
        }

        .nav-brand-text {
            display: flex;
            flex-direction: column;
        }

        .nav-brand-title {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 5px;
            line-height: 1;
        }

        .nav-brand-sub {
            font-size: 0.68rem;
            letter-spacing: 3.5px;
            color: var(--rocket-gold);
            margin-top: 3px;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.2rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.98rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            padding-bottom: 0.35rem;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--rocket-gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--rocket-gold-light);
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        /* ================= HERO PRINCIPAL (DISEÑO DEL BANNER) ================= */
        .hero {
            position: relative;
            min-height: 92vh;
            display: flex;
            align-items: center;
            padding: 4rem 2rem 6rem 2rem;
            background:
                radial-gradient(circle at 75% 45%, rgba(125, 60, 248, 0.32) 0%, transparent 48%),
                radial-gradient(circle at 20% 30%, rgba(70, 25, 145, 0.35) 0%, transparent 55%),
                linear-gradient(180deg, rgba(7, 4, 20, 0.62) 0%, rgba(7, 4, 20, 0.45) 55%, var(--space-dark) 100%),
                url('a_widescreen_high_contrast_sci_fi_website_hero_he.png') center/cover no-repeat;
            border-bottom: 2px solid rgba(229, 184, 105, 0.35);
            overflow: hidden;
        }

        /* Curvas decorativas doradas en las esquinas inferiores */
        .hero::before,
        .hero::after {
            content: '';
            position: absolute;
            bottom: -40px;
            width: 340px;
            height: 110px;
            border-top: 2px solid rgba(229, 184, 105, 0.55);
            background: linear-gradient(135deg, rgba(43, 16, 85, 0.85), rgba(7, 4, 20, 0.95));
            pointer-events: none;
        }

        .hero::before {
            left: -50px;
            border-radius: 0 100% 0 0;
            transform: rotate(6deg);
        }

        .hero::after {
            right: -50px;
            border-radius: 100% 0 0 0;
            transform: rotate(-6deg);
        }

        .hero-inner {
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 1.25fr 0.75fr;
            align-items: center;
            gap: 2rem;
            position: relative;
            z-index: 2;
        }

        .hero-content {
            max-width: 680px;
        }

        .hero-kicker {
            font-size: 0.92rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .hero-divider {
            height: 1px;
            width: 100%;
            max-width: 540px;
            background: linear-gradient(90deg, transparent 0%, var(--rocket-gold) 50%, transparent 100%);
            position: relative;
            margin: 0.8rem 0;
        }

        .hero-divider.with-star::after {
            content: '✦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--rocket-gold-light);
            font-size: 1.1rem;
            text-shadow: 0 0 12px #fff, 0 0 22px var(--rocket-gold);
        }

        .hero-title {
            font-size: clamp(4rem, 9vw, 6.8rem);
            font-weight: 900;
            letter-spacing: 14px;
            line-height: 0.95;
            margin: 0.5rem 0;
            text-transform: uppercase;
        }

        .hero-subtitle {
            font-size: clamp(1.35rem, 3vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 8px;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
        }

        .hero-description {
            font-size: 1.18rem;
            color: var(--text-light);
            max-width: 480px;
            margin: 1.5rem 0 2rem 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .btn-gold-outline {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.95rem 2.2rem;
            border-radius: 50px;
            border: 1.5px solid var(--rocket-gold);
            background: rgba(14, 7, 34, 0.72);
